# RiTAL — HARIBOSS 5-fold (clustered split)
# RiTAL — v31 architecture + seed rotation on plateau
#
# Key changes vs v31
# ------------------
#   seed_rotation.patience = 3   : when val_RP doesn't improve for 3 consecutive
#                                   epochs, reload best.pt, increment random seed,
#                                   and restart LR warmup from scratch.
#   reload_patience / reload_lr_scale removed (replaced by seed rotation)
#   early_stopping.patience = 999  (disabled; rely on seed rotation)
#   epochs: 30 per SLURM job; resubmit extends training automatically
#
# Everything else (model arch, loss, curriculum) is identical to v31.

seed: 42

seed_rotation:
  patience: 3      # rotate seed after 3 consecutive non-improving epochs

data:
  pkl_path: ${RITAL_DATA}/hariboss_5fd.pkl
  decoy_lookup_path: ${RITAL_DATA}/decoy_fp2_lookup.pkl
  rna3d_dirs:
    - ${RITAL_DATA}/json_pockets_clean

model:
  version: 3
  embed_dim: 256
  num_heads: 4
  dropout: 0.10
  max_rna_tokens: 80
  max_lig_tokens: 64

  include_pocket_feat: true

  rna_tower:
    encoder_type: egnn
    num_layers: 6

  interaction:
    num_layers: 4
    use_dist_bias: true

  use_pretrained_ligand: false

  ligand_tower:
    num_layers: 4

  projection:
    dim: 256
    normalize: true

train:
  batch_size: 8
  epochs: 30              # per SLURM job; auto-resubmit extends training
  steps_per_epoch: 1500
  lr: 5.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0

  lr_scheduler:
    type: cosine
    warmup_steps: 100
    min_lr_ratio: 0.02

  # K=72 = 48 cross-pocket + 24 hard (matches SMARTBind exactly)
  decoy_curriculum:
    stage1_negatives_per_positive: 48
    stage2_negatives_per_positive: 64
    stage3_negatives_per_positive: 72
    cross_pocket_ratio: 0.667

  val_decoy_k: 100

  moco_queue_size: 0
  moco_queue_in_smol_cts: false

hard_negative_mining:
  enabled: true
  start_epoch: 5
  refresh_every: 3
  n_candidates: 40
  keep_frac: 0.5

loss:
  use_circle_loss: false
  contrastive_temperature: 0.2

  ranking_margin: 0.6
  margin_restart_epochs: 8

  lambda_contrast: 0.1
  lambda_rank: 0.5
  lambda_rna_contrast: 0.3
  lambda_soft_rp: 2.0
  soft_rp_temp: 0.07

  lambda_site: 0.3
  site_start_epoch: 7

  hard_margin_topk: 0
  adaptive_margin: false

schedule:
  stage1_epochs: 1
  stage2_epochs: 3

output:
  checkpoint_dir: ${RITAL_RUNS}/hariboss5fd/fold0
  log_every: 50
  val_max_pockets: 0

early_stopping:
  patience: 999     # effectively disabled; seed rotation handles plateau
